[project]
name = "ciso-intel"
version = "1.0.0"
description = "CISO open-source threat intelligence briefs from Grok 4.7. Confirmed findings only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "xai-sdk>=1.20.0",
  "pydantic>=2.6",
  "python-dotenv>=1.0.1",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pypdf>=5.0",
  "reportlab>=4.2",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ciso-intel = "ciso_intel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
